name: hourly-balance

# Started from outside by cron-job.org (HTTP POST to the workflow_dispatch API), not by GitHub's own schedule.
# One call = one balance report. "Run workflow" on the Actions tab does the same thing by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-balance
  cancel-in-progress: false

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STATE_KEY: ${{ secrets.STATE_KEY }}
      C4_DATA_REPO: ${{ secrets.C4_DATA_REPO }}
      C4_DATA_TOKEN: ${{ secrets.C4_DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests cryptography
      - name: Send balance report
        run: python balance.py
