name: daily-summary

# Started from outside by cron-job.org once a day (HTTP POST to the workflow_dispatch API), not by GitHub's own schedule.
# force=true (default) sends yesterday's report on every call; force=false keeps the guards (only at/after summary_hour,
# only once per day) and then skips silently when a report for that day was already sent.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Send the report for yesterday now, ignoring the once-a-day guard. Default true: cron-job.org calls this once a day. Set false only if you call it several times a day."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STATE_KEY: ${{ secrets.STATE_KEY }}
      C4_DATA_REPO: ${{ secrets.C4_DATA_REPO }}
      C4_DATA_TOKEN: ${{ secrets.C4_DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests cryptography
      - name: Send report
        run: python summary.py ${{ inputs.force && '--force' || '' }}
