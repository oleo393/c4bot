name: connect4-bot

on:
  workflow_dispatch:        # "Run workflow" button (collaborators only)
    inputs:
      account:
        description: "Which account to start (all = every account)"
        type: choice
        default: all
        options: [all, main, alt, mmain, malt]
  schedule:
    - cron: "7 * * * *"     # hourly; each account exits quietly if enabled=false in its private config

permissions:
  contents: read

jobs:
  play:
    if: github.repository_owner == github.actor || github.event_name == 'schedule'
    runs-on: ubuntu-latest          # one fresh 4 vCPU / 16 GB VM per account
    timeout-minutes: 355
    strategy:
      fail-fast: false              # one account failing never stops the others
      matrix:
        account: ${{ fromJSON(github.event.inputs.account && github.event.inputs.account != 'all' && format('["{0}"]', github.event.inputs.account) || '["main","alt","mmain","malt"]') }}
    concurrency:
      group: connect4-${{ matrix.account }}   # one run per account; a queued run starts when the previous ends
      cancel-in-progress: false
    env:
      STATE_KEY: ${{ secrets.STATE_KEY }}
      C4_DATA_REPO: ${{ secrets.C4_DATA_REPO }}
      C4_DATA_TOKEN: ${{ secrets.C4_DATA_TOKEN }}
      C4_ACCOUNT: ${{ matrix.account }}
      C4_DATA_PREFIX: accounts/${{ matrix.account }}
      C4_MAX_RUNTIME_MIN: "335"
      # Webhook + player_id come from accounts/<name>/config.json in the private repo.
      # Do NOT set C4_PLAYER_ID / DISCORD_WEBHOOK_URL here: they would apply to every account.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run bot
        run: python c4bot.py
