name: connect4-bot

on:
  workflow_dispatch:        # "Run workflow" button (collaborators only)
    inputs:
      runner:
        description: "One or more, separated by commas: all, main, main-1, alt* (alt* = every session of alt)"
        type: string
        default: all
  schedule:
    - cron: "7 * * * *"     # hourly; a session exits quietly if it is disabled / not configured in its private config

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          PICK: ${{ github.event.inputs.runner }}
        run: |
          python3 - <<'PY'
          import json, os
          # EDIT HERE: your accounts and how many sessions each can run ("" = main session, "1", "2" = extra ones).
          # A session without a login state or without an entry under "slots" in its config simply exits.
          ACCOUNTS = ["main", "alt", "mmain", "malt", "gmain", "galt"]
          SLOTS = ["", "1", "2"]
          import re
          picks = [x for x in re.split(r"[,\s|]+", os.environ.get("PICK", "").strip()) if x] or ["all"]
          items = []
          for a in ACCOUNTS:
              for s in SLOTS:
                  name = a + (f"-{s}" if s else "")
                  if any(k == "all" or k == name or (k.endswith("*") and k[:-1] == a) for k in picks):
                      items.append({"account": a, "slot": s, "name": name})
          if not items:
              raise SystemExit(f"Nothing matches {picks}. Use: all, main, main-1, alt* (comma separated)")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": items}) + "\n")
          PY

  play:
    needs: plan
    name: ${{ matrix.name }}
    if: github.repository_owner == github.actor || github.event_name == 'schedule'
    runs-on: ubuntu-latest          # one fresh 4 vCPU / 16 GB VM per session
    timeout-minutes: 355
    strategy:
      fail-fast: false              # one session failing never stops the others
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: connect4-${{ matrix.name }}      # one run per session; a queued run starts when the previous ends
      cancel-in-progress: false
    env:
      STATE_KEY: ${{ secrets.STATE_KEY }}
      C4_DATA_REPO: ${{ secrets.C4_DATA_REPO }}
      C4_DATA_TOKEN: ${{ secrets.C4_DATA_TOKEN }}
      C4_ACCOUNT: ${{ matrix.account }}
      C4_SLOT: ${{ matrix.slot }}
      C4_DATA_PREFIX: accounts/${{ matrix.account }}
      C4_MAX_RUNTIME_MIN: "335"
      # Webhook + player_id come from accounts/<name>/config.json in the private repo.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Virtual display for headed Chrome
        run: which xvfb-run >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
      - name: Run bot
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python c4bot.py
